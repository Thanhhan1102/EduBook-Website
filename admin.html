<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý giáo trình | IUH EduBook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="admin-page">
    <header class="admin-header"><div class="container admin-header-inner"><a class="brand" href="index.html"><span class="brand-mark">E</span><span><strong>IUH EduBook</strong><small>TRANG QUẢN TRỊ</small></span></a><div class="admin-account"><span class="avatar">AD</span><span><strong>Quản trị EduBook</strong><small>Thư viện IUH</small></span><button class="text-button" id="logoutButton" type="button">Đăng xuất</button></div></div></header>
    <main class="admin-main container"><div class="admin-heading"><div><p class="eyebrow blue-text">Quản lý kho học liệu</p><h1>Giáo trình</h1><p>Thêm hoặc gỡ các đầu sách đang hiển thị cho sinh viên.</p></div><a class="button secondary" href="catalog.html">Xem catalog →</a></div><div class="admin-grid"><section class="admin-form-card"><h2>Thêm giáo trình</h2><form id="bookForm" class="book-form"><label>Tên giáo trình<input name="title" required placeholder="Ví dụ: Mạng máy tính" /></label><div class="form-row"><label>Mã môn<input name="code" required placeholder="IT301" /></label><label>Khoa<select name="faculty"><option>Khoa Công nghệ thông tin</option><option>Khoa Công nghệ Điện</option><option>Khoa Công nghệ Điện tử</option><option>Khoa Công nghệ Động lực</option><option>Khoa Công nghệ Nhiệt - Lạnh</option><option>Khoa Công nghệ May - Thời trang</option><option>Khoa Công nghệ Hóa học</option><option>Khoa Khoa học Cơ bản</option><option>Khoa Luật và Khoa học chính trị</option><option>Khoa Ngoại ngữ</option><option>Khoa Quản trị Kinh doanh</option><option>Khoa Thương mại - Du lịch</option><option>Khoa Kỹ thuật Xây dựng</option><option>Khoa Khoa học Sức khỏe</option></select></label></div><label>Tác giả / đơn vị biên soạn<input name="author" required placeholder="Bộ môn hoặc giảng viên" /></label><div class="form-row"><label>Giá bán<input name="price" type="number" min="0" required placeholder="45000" /></label><label>Giá thuê / kỳ<input name="rent" type="number" min="0" required placeholder="25000" /></label></div><div class="form-row"><label>Độ mới sách<select name="condition"><option value="new">Mới 100%</option><option value="over80">Trên 80%</option><option value="over60">Trên 60%</option></select></label><label>Tồn kho<input name="stock" type="number" min="0" value="10" required /></label></div><label>Ảnh bìa (URL)<input name="image" type="url" placeholder="https://..." /></label><label>Mô tả<textarea name="description" rows="3" placeholder="Mô tả ngắn về giáo trình"></textarea></label><button class="button primary full-width" type="submit">Thêm vào catalog <span>+</span></button><p class="form-message success" id="adminMessage" hidden></p></form></section><section class="admin-list-card"><div class="admin-list-head"><div><h2>Danh sách hiện có</h2><p id="bookCount"></p></div><button class="text-button" id="restoreBooks" type="button">Khôi phục mẫu</button></div><div id="adminBookList" class="admin-book-list"></div></section></div></main>
    <script src="assets/js/book-store.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/admin.js"></script>
  </body>
</html>
